<style>
:root{--bg:#e9ebf0;--pn:#f6f6fb;--card:#fff;--tx:#14121f;--mu:#7a778c;--bd:#ececf3;--ac:#7360e0;--ac2:#a190ff;--ok:#10b981;--bad:#ef4444;--h1:#e2e2e9;--h2:#f1f1f5;--r:20px;--sp:cubic-bezier(.34,1.56,.64,1)}
[data-t=dark]{--bg:#0b0a14;--pn:#13111f;--card:#1b1830;--tx:#efedff;--mu:#9a95b8;--bd:#2a2648;--h1:#2a2745;--h2:#221f3a}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Onest,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:20px;min-height:100vh;transition:background .5s}
.app{display:grid;grid-template-columns:240px 1fr;background:var(--card);border-radius:28px;min-height:calc(100vh - 40px);padding:14px 14px 14px 0;transition:background .5s}
aside{padding:6px 14px 6px 20px;display:flex;flex-direction:column}.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin:6px 0 18px}
.logo i{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff}
.links{position:relative}.gl{font-size:12px;color:var(--mu);margin:18px 6px 6px}
.links a{position:relative;z-index:1;display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--mu);cursor:pointer;transition:color .3s,transform .3s var(--sp)}
.links a:hover{color:var(--tx);transform:translateX(4px)}.links a.on{color:var(--ac);font-weight:500}
.pill{position:absolute;left:0;right:0;border-radius:14px;background:color-mix(in srgb,var(--ac) 13%,transparent);transition:top .6s var(--sp),height .6s var(--sp)}
.pill.sq{animation:sq .6s ease}@keyframes sq{35%{transform:scale(1.05,.86);border-radius:22px}}
.sync{margin-top:auto;padding:14px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 14%,var(--card)),var(--pn))}.sync small{display:block;color:var(--mu);word-break:break-word}
.mw{display:flex;flex-direction:column;min-width:0}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 6px 14px}header h2{margin:0;flex:1;font-size:21px;font-weight:500;color:var(--mu)}
.sr{flex-direction:row;align-items:center;gap:8px;background:var(--pn);border-radius:999px;padding:0 14px;transition:box-shadow .4s,width .5s var(--sp);width:260px}.sr:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent);width:320px}.sr input{border:0;background:none;padding:9px 0;outline:0}
.av{display:flex;align-items:center;gap:8px;background:var(--pn);border-radius:999px;padding:4px 14px 4px 4px}.av i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-style:normal;font-weight:600}.av span{display:flex;flex-direction:column;line-height:1.15}.av small{color:var(--mu);font-size:11px}
main{position:relative;flex:1;background:var(--pn);border-radius:24px;padding:18px;overflow:hidden;transition:background .5s}#v{position:relative;z-index:1}
#bg{position:absolute;inset:0;filter:url(#goo) blur(26px);opacity:.5;pointer-events:none}#bg i{position:absolute;border-radius:50%;width:220px;height:220px;background:linear-gradient(135deg,var(--ac2),color-mix(in srgb,var(--ac2) 45%,#fff));animation:fl 14s ease-in-out infinite alternate}
#bg i:nth-child(1){left:6%;top:8%}#bg i:nth-child(2){right:4%;top:30%;animation-duration:18s;background:linear-gradient(135deg,#7ad7e5,#bdf2f7)}#bg i:nth-child(3){left:40%;bottom:-6%;animation-duration:22s;background:linear-gradient(135deg,#f9b8d3,#ffdcc4)}#bg .mb{width:150px;height:150px;animation:none;left:0;top:0}
@keyframes fl{to{transform:translate(90px,-60px) scale(1.3) rotate(40deg)}}
#v>*:not(.ov),.ov>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;outline:0;transition:border-color .3s,box-shadow .3s,transform .3s var(--sp)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent)}
button{cursor:pointer;position:relative;overflow:hidden}button:hover{transform:translateY(-2px);border-color:var(--ac)}button:active{transform:scale(.95)}
.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}.d{color:var(--bad)}.ib{border-radius:999px;background:var(--pn);border:0}.rp{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:color-mix(in srgb,var(--ac) 27%,transparent);animation:rp .7s ease-out forwards;pointer-events:none}.p .rp{background:#fff6}@keyframes rp{to{transform:scale(28);opacity:0}}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:16px;position:relative;overflow:hidden;transition:transform .5s var(--sp),box-shadow .4s,background .5s}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--ac) 12%,transparent),transparent 70%)}.card:hover::after{opacity:1}
.ov .card{margin:0}.ov .card:hover{transform:translateY(-4px);box-shadow:0 16px 36px color-mix(in srgb,var(--ac) 14%,transparent)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}input,select,textarea{width:100%}input[readonly]{background:var(--pn)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left}th{font-size:12px;font-weight:500;color:var(--mu);background:var(--pn)}tr:hover td{background:var(--pn)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}.cards .card{margin:0}.cards small{color:var(--mu)}.cards b{display:block;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.ok{color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{min-height:76px;border-radius:12px;padding:5px;font-size:11px;background:var(--card);transition:transform .3s var(--sp)}.cal div:hover{transform:scale(1.04)}.cal .h{min-height:0;text-align:center;background:none;color:var(--mu)}
.chip{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-radius:8px;padding:1px 6px;margin-top:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.s2{grid-column:span 2}.s4{grid-column:span 4}
.sc{display:flex;justify-content:space-between;align-items:flex-start}.sc small,.ttl{color:var(--mu);font-size:16px}.big{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.25}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex-shrink:0}.ico.sm{width:36px;height:36px;border-radius:11px;background:var(--pn);color:var(--tx)}.pu{background:linear-gradient(135deg,#6b57e6,#a190ff)}.gr{background:linear-gradient(135deg,#10b981,#34d399)}.or{background:linear-gradient(135deg,#f97316,#fb923c)}
.ft{border-top:1px solid var(--bd);margin:14px -18px -4px;padding:12px 18px 0;color:var(--mu)}.ft b{color:var(--tx);font-weight:500}.r0{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.plot{position:relative;height:230px;display:flex;gap:8px;margin-top:14px}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer}
.col b{width:78%;height:0;border-radius:14px;background:repeating-linear-gradient(135deg,var(--h1) 0 2px,var(--h2) 2px 6px);transition:height 1s cubic-bezier(.34,1.3,.5,1) var(--d),background .5s,width .5s var(--sp)}.in .col b{height:calc((100% - 26px)*var(--k))}
.col.on b{background:linear-gradient(180deg,var(--ac2),var(--ac));width:92%;border-radius:18px 18px 12px 12px}.col span{height:26px;line-height:26px;font-size:12px;color:var(--mu)}
.dash{position:absolute;left:0;right:0;bottom:calc(var(--ty,0px));border-top:1.5px dashed var(--ac);opacity:.45;transition:bottom .7s var(--sp)}
.tip{position:absolute;left:var(--tx,0);bottom:calc(var(--ty,0px) + 10px);transform:translateX(-50%);background:var(--ac);color:#fff;padding:3px 11px;border-radius:10px;font-size:12px;white-space:nowrap;z-index:2;transition:left .7s var(--sp),bottom .7s var(--sp)}
.bd{background:#10b9811f;color:var(--ok);border-radius:8px;padding:1px 8px;font-size:12px;margin-left:6px}.seg{display:flex;gap:4px;margin:14px 0;height:26px;padding:4px;border:1px solid var(--bd);border-radius:10px}.seg i{border-radius:6px;background:linear-gradient(135deg,var(--ac),var(--ac2));transition:width 1s var(--sp)}.seg i.h{background:repeating-linear-gradient(135deg,var(--h1) 0 2px,var(--h2) 2px 6px)}
.li{display:flex;justify-content:space-between;padding:7px 0}.li u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:9px;background:var(--ac)}.li u.g2{background:#c9c9d3}.li u.t{background:#14b8c4}
.up{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.up:last-child{border:0}.up i{width:46px;padding:5px 0;text-align:center;border-radius:12px;background:var(--pn);font-style:normal;line-height:1.2}.up i b{display:block;font-size:17px}.up small{color:var(--mu)}
.st{border-radius:999px;padding:1px 10px;font-size:12px}.st.l{background:#10b9811f;color:var(--ok)}.st.pe{background:#ef44441a;color:var(--bad)}
